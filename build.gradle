plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = mod_group_id
version = mod_version
base.archivesName = "${mod_id}-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()

evaluationDependsOn(':open-lights')

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = false
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                taczopenlights { source sourceSets.main }
                openlights { source project(':open-lights').sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

mixin {
    add sourceSets.main, 'taczflashierflashlights.refmap.json'
    config 'taczflashierflashlights.mixins.json'
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('maven.modrinth:timeless-and-classics-zero:yOVIzIJR')
    implementation project(':open-lights')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}

tasks.named('jar', Jar).configure {
    from('LICENSE', 'THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
    manifest.attributes('MixinConfigs': 'taczflashierflashlights.mixins.json',
            'Implementation-Version': project.version)
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test).configure { useJUnitPlatform() }


if (project.hasProperty('smoke')) {
    sourceSets {
        smoke {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    configurations.smokeImplementation.extendsFrom configurations.implementation
    configurations.smokeRuntimeOnly.extendsFrom configurations.runtimeOnly
    minecraft.runs.client {
        mods {
            taczopenlights { source sourceSets.smoke }
        }
        property 'taczflashierflashlights.smoke', 'true'
    }
}

tasks.withType(JavaExec).configureEach { standardInput = System.in }




if (project.hasProperty('shaderSmoke')) {
    dependencies {
        runtimeOnly fg.deobf('maven.modrinth:embeddium:UTbfe5d1')
        runtimeOnly fg.deobf('maven.modrinth:oculus:iQ1SwGc3')
    }
}

tasks.named('compileJava', JavaCompile) {
    // Mixin refmaps describe all mixins, so incremental partial compilation is unsafe.
    options.incremental = false
}

tasks.register('verifyModJar') {
    dependsOn tasks.named('reobfJar')
    doLast {
        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            if (zip.getEntry('taczflashierflashlights.refmap.json') == null) {
                throw new GradleException('Missing Mixin refmap in ' + artifact.name)
            }
            if (zip.entries().toList().any { it.name.contains('/smoke/') }) {
                throw new GradleException('Development smoke code leaked into ' + artifact.name)
            }
        }
    }
}
tasks.named('build') { dependsOn tasks.named('verifyModJar') }

// Optional development-only dependency for the flashlight-defaults compatibility gate.
if (project.hasProperty('tacticalBreachingSmoke')) {
    dependencies {
        if (project.property('tacticalBreachingSmoke').toString() != 'absent') {
            runtimeOnly fg.deobf('maven.modrinth:tacz-tactical-breaching:cvSOVRCE')
        }
    }
    minecraft.runs.client {
        property 'taczopenlights.compatSmoke', project.property('tacticalBreachingSmoke').toString()
    }
}



tasks.named('sourcesJar', Jar) {
    from('LICENSE', 'THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
}
